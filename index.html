<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CHILL ETHAKAAA | Banana Geometry Lab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍌</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F8F5EC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #appFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      z-index: 10;
      background-color: #F8F5EC;
      transition: opacity 0.5s ease;
    }
    #loaderOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #F8F5EC 0%, #EDE8DC 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #loaderOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .banana-pulse {
      font-size: 64px;
      animation: bounce-pulse 1.6s infinite ease-in-out;
      margin-bottom: 20px;
    }
    .loader-title {
      font-size: 24px;
      font-weight: 800;
      color: #171717;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .loader-sub {
      font-size: 14px;
      font-weight: 500;
      color: #5A5954;
      margin-bottom: 24px;
      letter-spacing: 0.05em;
    }
    .loader-bar-bg {
      width: 260px;
      height: 6px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .loader-bar-fill {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #F4B400, #EAB308);
      border-radius: 999px;
      animation: indeterminate 1.8s infinite ease-in-out;
    }
    .wake-hint {
      margin-top: 18px;
      font-size: 12px;
      color: #8E8D86;
    }
    @keyframes bounce-pulse {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.1) translateY(-8px); }
    }
    @keyframes indeterminate {
      0% { transform: translateX(-100%); width: 30%; }
      50% { transform: translateX(100%); width: 60%; }
      100% { transform: translateX(300%); width: 30%; }
    }
  </style>
</head>
<body>
  <!-- Seamless Loading Screen -->
  <div id="loaderOverlay">
    <div class="banana-pulse">🍌</div>
    <div class="loader-title">CHILL ETHAKAAA</div>
    <div class="loader-sub">BANANA GEOMETRY LAB • INITIALIZING</div>
    <div class="loader-bar-bg">
      <div class="loader-bar-fill"></div>
    </div>
    <div class="wake-hint" id="wakeHint">Connecting to AI curvature engine on Render...</div>
  </div>

  <!-- Full-Screen Streamlit Web Application Frame -->
  <iframe
    id="appFrame"
    src="https://banana-curve-analyzer.onrender.com"
    allow="clipboard-read; clipboard-write; camera"
    loading="eager"
  ></iframe>

  <script>
    const frame = document.getElementById("appFrame");
    const loader = document.getElementById("loaderOverlay");
    const wakeHint = document.getElementById("wakeHint");

    // Hide loader once the iframe responds
    frame.addEventListener("load", () => {
      setTimeout(() => {
        loader.classList.add("hidden");
      }, 800);
    });

    // Fallback: If cold start on Render takes ~25s, notify user nicely
    setTimeout(() => {
      if (!loader.classList.contains("hidden")) {
        wakeHint.textContent = "Waking up server container (~20 seconds on free tier)...";
      }
    }, 6000);

    setTimeout(() => {
      if (!loader.classList.contains("hidden")) {
        wakeHint.textContent = "Almost ready! Finalizing laboratory workstation...";
      }
    }, 18000);

    // Hard safety timeout: reveal frame after 35s even if load event was masked
    setTimeout(() => {
      loader.classList.add("hidden");
    }, 35000);
  </script>
</body>
</html>
